[project]
name = "251220-pydanticai-htmx"
version = "0.1.0"
description = "FastAPI + HTMX chat application with Pydantic AI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.126.0",
    "jinja2>=3.1.0",
    "logfire>=4.16.0",
    "pydantic-ai>=1.37.0",
    "python-multipart>=0.0.9",
    "ruff>=0.14.10",
    "uvicorn[standard]>=0.38.0",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]  # pycodestyle errors, pyflakes, isort
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
